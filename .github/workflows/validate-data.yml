name: Validar datos y calendarios
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar catálogos masculinos
        run: node scripts/validate-data.mjs
      - name: Probar calendarios
        run: node scripts/test-fixtures.mjs
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check game.js
          node --check game3d.js
          node --check scripts/validate-data.mjs
          node --check scripts/test-fixtures.mjs
